<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Heist Creator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Heist Creator (admin) -->
    <div id="creator" class="page hidden">
        <div class="window creator-window">
            <aside class="side">
                <div class="brand">
                    <span class="brand-mark">HC</span>
                    <div>
                        <div class="brand-title">HEIST CREATOR</div>
                        <div class="brand-sub">ヘイスト作成ツール</div>
                    </div>
                </div>
                <button class="btn primary block" data-act="new-heist">＋ 新しいヘイスト</button>
                <div class="side-label">保存済みヘイスト</div>
                <div id="creator-list" class="side-list"></div>
                <button class="btn ghost block" data-act="view-taxonomy">ジャンル・タグ</button>
                <button class="btn ghost block" data-act="view-npcs">受付NPCの設定</button>
            </aside>
            <main class="main">
                <header class="main-head">
                    <div id="creator-title" class="main-title"></div>
                    <div class="head-actions" id="creator-actions"></div>
                    <button class="btn icon" data-act="close" title="閉じる">✕</button>
                </header>
                <nav id="creator-tabs" class="tabs"></nav>
                <section id="creator-content" class="content"></section>
            </main>
        </div>
        <datalist id="dl-items"></datalist>
        <datalist id="dl-models"></datalist>
        <datalist id="dl-weapons"></datalist>
        <div id="creator-picker" class="picker-layer hidden"></div>
        <div id="creator-props" class="prop-layer hidden"></div>
        <div id="creator-toast" class="toast hidden"></div>
    </div>

    <!-- Heist HUD (player) -->
    <div id="hud" class="page hidden">
        <div class="window hud-window">
            <header class="hud-head">
                <div class="brand">
                    <span class="brand-mark">HH</span>
                    <div>
                        <div class="brand-title">HEIST HUD</div>
                        <div class="brand-sub">ヘイストを選んでクルーと共に挑め</div>
                    </div>
                </div>
                <div class="hud-head-right">
                    <div class="chip" id="hud-police"></div>
                    <button class="btn icon" data-act="close" title="閉じる">✕</button>
                </div>
            </header>
            <div class="hud-body">
                <aside class="hud-side">
                    <div id="hud-player" class="card"></div>
                    <div id="hud-party" class="card grow"></div>
                </aside>
                <section class="hud-list">
                    <div class="section-title">ヘイスト一覧</div>
                    <div id="hud-filters" class="hud-filters"></div>
                    <div id="hud-heists" class="heist-grid"></div>
                </section>
                <aside id="hud-detail" class="hud-detail"></aside>
            </div>
        </div>
        <div id="hud-toast" class="toast hidden"></div>
    </div>

    <!-- Minigames -->
    <div id="minigame" class="page hidden">
        <div class="mg-window">
            <div class="mg-head">
                <div id="mg-title" class="mg-title"></div>
                <div id="mg-hint" class="mg-hint"></div>
            </div>
            <div class="mg-timer"><div id="mg-timer-bar"></div></div>
            <div id="mg-grid" class="mg-grid"></div>
        </div>
    </div>

    <!-- Guidance overlay (bottom-right) -->
    <div id="overlay">
        <div id="bubbles"></div>
        <div id="objective" class="objective hidden">
            <div class="objective-head">
                <span id="objective-title"></span>
                <span id="objective-timer" class="objective-timer"></span>
            </div>
            <div id="objective-text" class="objective-text"></div>
            <div class="objective-foot">
                <span id="objective-step"></span>
                <span id="objective-crew"></span>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/overlay.js"></script>
    <script src="js/minigames.js"></script>
    <script src="js/creator.js"></script>
    <script src="js/creator-extra.js"></script>
    <script src="js/hud.js"></script>
</body>
</html>
